# Render Blueprint — SentinelVault (Telegraph Season I)
#
# Track 1: sentinelvault-cve — the CVE_LOOKUP miner data service.
# Track 3: sentinelvault-app — the vetting product (live x402 signal source).
services:
  - type: web
    name: sentinelvault-cve
    runtime: node
    region: oregon
    plan: free
    rootDir: miner-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0

  - type: web
    name: sentinelvault-app
    runtime: node
    region: oregon
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: SIGNAL_SOURCE
        value: live
      - key: PROOF_MODE
        value: logging
      # Set SENTINEL_PK as a secret in the Render dashboard (never commit it).
      - key: SENTINEL_PK
        sync: false